<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPKAPIAI - Giriş Yap</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --ws-bg: #0f1423;
            --ws-card: #161d30;
            --ws-border: #2a344a;
            --ws-accent: #3b82f6;
            --ws-accent-hover: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        ::selection { background: var(--ws-accent); color: #fff; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--ws-bg);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            width: 24rem;
            height: 24rem;
            border-radius: 50%;
            mix-blend-mode: screen;
            filter: blur(150px);
            opacity: .1;
        }
        .bg-glow::before {
            top: 0; left: -2.5rem;
            background: var(--ws-accent);
        }
        .bg-glow::after {
            bottom: -2.5rem; right: 2.5rem;
            background: #4f46e5;
        }

        .login-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 28rem;
            padding: 0 1.5rem;
        }

        .login-card {
            background: rgba(22, 29, 48, .9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--ws-border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background: var(--ws-bg);
            border: 1px solid var(--ws-border);
            box-shadow: 0 4px 14px rgba(0,0,0,.3);
            margin-bottom: .75rem;
        }
        .login-icon svg {
            width: 1.75rem;
            height: 1.75rem;
            color: var(--ws-accent);
            stroke: currentColor;
            fill: none;
        }
        .login-kicker {
            color: var(--ws-accent);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .15em;
            text-transform: uppercase;
            margin-bottom: .25rem;
        }
        .login-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: .03em;
        }
        .login-subtitle {
            color: #9ca3af;
            font-size: .75rem;
            margin-top: .5rem;
            line-height: 1.6;
            padding: 0 1rem;
        }

        .login-tabs {
            display: flex;
            gap: .25rem;
            padding: .25rem;
            background: var(--ws-bg);
            border: 1px solid var(--ws-border);
            border-radius: .75rem;
            margin-bottom: 1.5rem;
        }
        .login-tab {
            flex: 1;
            padding: .5rem;
            font-size: .875rem;
            font-weight: 500;
            border: none;
            border-radius: .5rem;
            cursor: pointer;
            transition: all .2s;
            background: transparent;
            color: #9ca3af;
        }
        .login-tab:hover { color: #e2e8f0; }
        .login-tab.active {
            background: #fff;
            color: var(--ws-bg);
            font-weight: 600;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }

        .login-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            padding: .625rem 1rem;
            border: 1px solid var(--ws-border);
            border-radius: .75rem;
            font-size: .875rem;
            font-weight: 500;
            color: #e2e8f0;
            background: rgba(15, 20, 35, .5);
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
            margin-bottom: 1.25rem;
        }
        .login-google:hover { background: rgba(42, 52, 74, .5); }
        .login-google svg { width: 1rem; height: 1rem; flex-shrink: 0; }

        .login-divider {
            display: flex;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--ws-border);
        }
        .login-divider span {
            padding: 0 .75rem;
            font-size: 10px;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .12em;
            white-space: nowrap;
        }

        .login-form { display: grid; gap: 1rem; }

        .login-field { display: grid; gap: .375rem; }
        .login-field[hidden] { display: none !important; }
        .login-field label {
            font-size: .75rem;
            font-weight: 500;
            color: #9ca3af;
        }
        .login-field input {
            width: 100%;
            padding: .625rem 1rem;
            border: 1px solid var(--ws-border);
            border-radius: .75rem;
            background: var(--ws-bg);
            color: #fff;
            font-size: .875rem;
            font-family: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .login-field input::placeholder { color: #6b7280; }
        .login-field input:focus {
            border-color: var(--ws-accent);
            box-shadow: 0 0 0 1px var(--ws-accent);
        }

        .login-forgot {
            display: flex;
            justify-content: flex-end;
            margin-top: .125rem;
        }
        .login-forgot a {
            font-size: .75rem;
            font-weight: 500;
            color: var(--ws-accent);
            text-decoration: none;
        }
        .login-forgot a:hover { color: var(--ws-accent-hover); }

        .login-error {
            color: #f87171;
            font-size: .8rem;
            text-align: center;
            padding: .5rem;
            background: rgba(248, 113, 113, .08);
            border-radius: .5rem;
        }
        .login-error[hidden] { display: none !important; }

        .login-submit {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: .75rem 1rem;
            border: none;
            border-radius: .75rem;
            font-size: .875rem;
            font-weight: 600;
            color: #fff;
            background: var(--ws-accent);
            box-shadow: 0 0 15px rgba(59, 130, 246, .4);
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
            margin-top: .5rem;
        }
        .login-submit:hover { background: var(--ws-accent-hover); }
        .login-submit:disabled { opacity: .6; cursor: not-allowed; }
        .login-submit svg {
            width: 1rem;
            height: 1rem;
            stroke: currentColor;
            fill: none;
            transition: transform .2s;
        }
        .login-submit:hover svg { transform: translateX(4px); }

        .login-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .375rem;
            margin-top: 1.25rem;
            font-size: 10px;
            font-weight: 500;
            color: #10b981;
        }
        .login-note svg {
            width: .875rem;
            height: .875rem;
            stroke: currentColor;
            fill: none;
            flex-shrink: 0;
        }

        .login-footer {
            text-align: center;
            font-size: .75rem;
            color: #4b5563;
            margin-top: 1.5rem;
        }

        .login-description {
            text-align: center;
            font-size: .8rem;
            color: #9ca3af;
            margin-bottom: 1rem;
        }
        .login-description[hidden] { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-wrap">
        <div class="login-card">

            <div class="login-header">
                <div class="login-icon">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                </div>
                <p class="login-kicker">Yapay Zeka Destekli CAD Platformu</p>
                <h1 id="auth-title" class="login-title">Topkapı Okulları</h1>
                <p id="auth-description" class="login-description" hidden></p>
                <p class="login-subtitle">Teknik çizimden 3D modele, CAM planından CNC çıktısına kadar tek çalışma alanı.</p>
            </div>

            <div class="login-tabs" role="tablist">
                <button id="login-tab" class="login-tab active" type="button" role="tab" aria-selected="true">Giriş yap</button>
                <button id="register-tab" class="login-tab" type="button" role="tab" aria-selected="false">Yeni hesap</button>
            </div>

            <button id="google-login" class="login-google" type="button">
                <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Google ile devam et
            </button>

            <div class="login-divider"><span>veya e-posta ile</span></div>

            <form id="auth-form" class="login-form">
                <div id="name-wrap" class="login-field" hidden>
                    <label for="name">Ad soyad</label>
                    <input id="name" type="text" autocomplete="name" placeholder="Adınız ve soyadınız">
                </div>

                <div class="login-field">
                    <label for="email">E-posta adresi</label>
                    <input id="email" type="email" required autocomplete="email" placeholder="ornek@okul.edu.tr">
                </div>

                <div class="login-field">
                    <label for="password">Parola</label>
                    <input id="password" type="password" minlength="8" required autocomplete="current-password" placeholder="En az 8 karakter">
                    <div class="login-forgot">
                        <a href="#">Şifremi unuttum</a>
                    </div>
                </div>

                <p id="auth-error" class="login-error" role="alert" hidden></p>

                <button id="submit" class="login-submit" type="submit">
                    <span>Giriş yap</span>
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>

            <p class="login-note">
                <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Yeni hesaplara her ay 50.000 ücretsiz token tanımlanır.
            </p>
        </div>

        <p class="login-footer">© 2026 Topkapı Okulları Yapay Zeka</p>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
