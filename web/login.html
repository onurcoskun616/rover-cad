<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOPKAPIAI · Giriş Yap</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login-v2.css">
</head>
<body class="auth-page auth-page-v2">
  <main class="auth-shell">
    <div class="auth-bg-lights" aria-hidden="true">
      <span class="auth-light auth-light-one"></span>
      <span class="auth-light auth-light-two"></span>
    </div>

    <section class="auth-card-v2" aria-label="TOPKAPIAI giriş">
      <div class="auth-logo-wrap">
        <div class="auth-logo-orbit">
          <img src="logo.png" alt="Topkapı Okulları logosu" class="auth-logo">
        </div>
        <p class="auth-eyebrow">YAPAY ZEKA DESTEKLI CAD PLATFORMU</p>
        <h1 id="auth-title">Topkapı Okulları</h1>
        <p id="auth-description">Teknik çizimden 3D modele, CAM planından CNC çıktısına kadar tek çalışma alanı.</p>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Hesap işlemleri">
        <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true">Giriş yap</button>
        <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false">Yeni hesap</button>
      </div>

      <button id="google-login" class="auth-google" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.29h6.47c-.28 1.5-1.13 2.77-2.4 3.62v2.79h3.89c2.27-2.09 3.53-5.17 3.53-8.43Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.89-2.79c-1.08.72-2.45 1.14-4.06 1.14-3.12 0-5.77-2.11-6.71-4.94H1.28v2.88C3.26 21.31 7.33 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.29 14.51c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28V7.07H1.28C.47 8.69 0 10.41 0 12.23s.47 3.54 1.28 5.16l4.01-2.88Z"/>
          <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.59 1.8l3.44-3.44C17.95 1.19 15.23 0 12 0 7.33 0 3.26 2.69 1.28 6.61l4.01 3.11C6.23 6.88 8.88 4.77 12 4.77Z"/>
        </svg>
        <span>Google ile devam et</span>
      </button>

      <div class="auth-divider"><span>veya e-posta ile</span></div>

      <form id="auth-form" class="auth-form">
        <label id="name-wrap" class="auth-field" hidden>
          <span>Ad soyad</span>
          <input id="name" type="text" autocomplete="name" placeholder="Adınız ve soyadınız">
        </label>

        <label class="auth-field">
          <span>E-posta adresi</span>
          <input id="email" type="email" required autocomplete="email" placeholder="ornek@okul.edu.tr">
        </label>

        <label class="auth-field">
          <span>Parola</span>
          <input id="password" type="password" minlength="8" required autocomplete="current-password" placeholder="En az 8 karakter">
        </label>

        <button id="forgot-password" class="auth-link-button" type="button">Şifremi unuttum</button>
        <p id="auth-error" class="auth-error" role="alert" hidden></p>
        <button id="submit" class="auth-submit" type="submit">
          <span>Giriş yap</span>
          <b aria-hidden="true">→</b>
        </button>
      </form>

      <p class="auth-note"><span aria-hidden="true">✓</span> Yeni hesaplara her ay 50.000 ücretsiz token tanımlanır.</p>
    </section>

    <p class="auth-footer">© 2026 Topkapı Okulları Yapay Zeka</p>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
