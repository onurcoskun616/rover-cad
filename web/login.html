<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rover CAD · Giriş</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><header class="site-header auth-header"><img src="logo.png" class="logo" alt="Topkapı"><h1 class="brand-title">ROVER CAD</h1><p class="brand-subtitle">Yapay Zeka Destekli Üretim Platformu</p><p class="subtitle">3D model, teknik çizim, CAM ve CNC çıktıları için hesabınıza giriş yapın.</p></header>
<main class="auth-main"><section class="prompt-section auth-card"><div class="tabs"><button id="login-tab" class="tab active">Giriş yap</button><button id="register-tab" class="tab">Üye ol</button></div><form id="auth-form"><label id="name-wrap" hidden>Ad soyad<input id="name" autocomplete="name"></label><label>E-posta<input id="email" type="email" required autocomplete="email"></label><label>Parola<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><button id="submit" type="submit">Giriş yap</button><p id="auth-error" class="form-error" hidden></p></form></section></main><script type="module" src="login.js"></script></body></html>
